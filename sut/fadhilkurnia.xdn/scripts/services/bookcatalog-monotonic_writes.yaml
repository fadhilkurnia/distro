---
name: bookcatalog
image: fadhilkurnia/xdn-bookcatalog
stateful: true
entry: true
port: 80
state: /app/data/
deterministic: true
consistency: monotonic_writes
requests:
  - path_prefix: "/"
    methods: "GET,OPTIONS,HEAD"
    behavior: read_only
  - path_prefix: "/"
    methods: "PUT,POST,DELETE"
    behavior: write_only
  - path_prefix: "/"
    methods: "PUT,POST,DELETE"
    behavior: monotonic
