services:
  restkv:
    image: michael2718/restkv:1
    container_name: restkv
    user: 1000:1000
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - RUST_BACKTRACE=full
    volumes:
      - type: bind
        source: ./restkv-volume
        target: /data/
      - /etc/passwd:/etc/passwd:ro

