services:
  restkv:
    image: michael2718/restkv:1
    container_name: restkv
    user: 1000:1000
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - RUST_BACKTRACE=full
    volumes:
      - /etc/passwd:/etc/passwd:ro

  proxy:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - restkv
